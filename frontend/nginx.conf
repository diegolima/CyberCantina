server {
    listen 80;
    server_name localhost;

    # Compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://cybercantina-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for Server-Sent Events (SSE) streaming turns
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Extended timeouts for local LLM inference
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Support large character card imports and gallery image uploads
        client_max_body_size 50M;
    }

    # Developer Swagger documentation
    location /docs {
        proxy_pass http://cybercantina-backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://cybercantina-backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
