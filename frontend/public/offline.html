<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <title>CyberCantina — Server Unreachable</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: radial-gradient(circle at top, #171e2c 0%, #0b0e14 65%);
        color: #f1f5f9;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .offline-card {
        width: 100%;
        max-width: 420px;
        background: #111621;
        border: 1px solid #252f42;
        border-radius: 14px;
        padding: 28px 24px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .offline-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 12px;
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.42);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 10px;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #94a3b8;
        margin-bottom: 20px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid rgba(245, 158, 11, 0.42);
        background: rgba(245, 158, 11, 0.14);
        color: #fbbf24;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      button:hover {
        background: rgba(245, 158, 11, 0.24);
        border-color: #f59e0b;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="offline-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
        </svg>
      </div>
      <h1>Cannot reach CyberCantina server</h1>
      <p>
        Campaigns, CARE state, and AI inference require an active connection to your CyberCantina server.
        Check your network or server status and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Retry Connection</button>
    </main>
  </body>
</html>
