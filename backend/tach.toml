source_roots = ["."]
exclude = [
    ".venv",
    "tests",
    "__pycache__",
]
# Intentional runtime coupling remains between config<->providers (ModelProfile.resolved),
# db<->providers (vector_math endpoint resolution), db<->engine.affective_engine,
# and facade<->subpackage monkeypatch hooks; strict layered dependencies still block
# any lower layer from importing services, routers, wizards, or main.
forbid_circular_dependencies = false

[[modules]]
path = "app.security"
depends_on = []

[[modules]]
path = "app.prompts"
depends_on = []

[[modules]]
path = "app.config"
depends_on = [
    "app.providers",
]

[[modules]]
path = "app.schemas"
depends_on = [
    "app.config",
]

[[modules]]
path = "app.providers"
depends_on = [
    "app.config",
    "app.db",
    "app.schemas",
    "app.security",
]

[[modules]]
path = "app.db"
