[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercantina-backend"
version = "0.1.0"
description = "Agentic AI Roleplay Framework with 4-Phase Cognition, Branch-Safe Spatial Graph, and 3-Tier Memory"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "argon2-cffi>=23.1.0",
    "webauthn>=2.2.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.3.0",
    "sqlite-vec>=0.1.1",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.17.0",
    "tach>=0.35.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023", "B904", "B905"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"app/db/repository.py" = ["F401", "F403"]
"app/db/vector_store.py" = ["F401", "F403"]
"app/engine/affective_engine.py" = ["F401", "F403"]
"app/engine/character_agent.py" = ["F401", "F403"]
"app/engine/phase2_context.py" = ["F401", "F403"]
"app/engine/phase3_cognition.py" = ["F401", "F403"]
"app/engine/phase5_clerk.py" = ["F401", "F403"]
"app/engine/mentions.py" = ["F401"]
"app/main.py" = ["F401"]
"app/routers/campaigns.py" = ["F401", "F403"]
"app/wizards/character_wizard.py" = ["F401", "F403"]
"tests/*" = ["F841", "B017"]
