name: CI & Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"
      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint, check boundaries, and verify architecture docs
        working-directory: backend
        run: |
          ruff check app tests ../scripts/generate_arch_docs.py
          tach check
          python ../scripts/generate_arch_docs.py --check
      - name: Run pytest
        working-directory: backend
        run: pytest -n auto tests

  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check boundaries, CSS audit, build, and run tests
        run: npm --prefix frontend run arch:check && npm --prefix frontend run css:audit && npm --prefix frontend run build && npm --prefix frontend test
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E smoke suite
        run: npm --prefix frontend run typecheck:e2e && npm --prefix frontend run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    name: Docker Build & Push
    needs: [backend, frontend]
    if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:backend"
          pull: true
          no-cache: true
          push: true
          tags: diegolima/cybercantina-backend:alpha,diegolima/cybercantina-backend:alpha-${{ github.sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "{{defaultContext}}:frontend"
          pull: true
          no-cache: true
          push: true
          tags: diegolima/cybercantina-frontend:alpha,diegolima/cybercantina-frontend:alpha-${{ github.sha }}
